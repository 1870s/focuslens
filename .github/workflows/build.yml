name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [ "26.1.2", "26.2", "26.3" ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build -Pmc=${{ matrix.mc }} --stacktrace

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: focuslens-fabric-mc${{ matrix.mc }}
          path: fabric/build/libs/*.jar

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: focuslens-neoforge-mc${{ matrix.mc }}
          path: neoforge/build/libs/*.jar
