plugins {
    id 'java-library'
}

base {
    archivesName = "${mod_id}-${project.name}"
}
version = "${project.version}+mc${minecraft_version}"

// Version-specific source overlays. versions/<mc>.properties lists them in `source_overlays`
// (comma separated, e.g. "mc26_2_up"); each overlay adds src/<overlay>/java and src/<overlay>/resources.
// A class must live in exactly one active directory, so overlays are used for disjoint version ranges.
def overlays = (project.findProperty('source_overlays') ?: '').toString().split(',').collect { it.trim() }.findAll { it }
overlays.each { overlay ->
    sourceSets.main.java.srcDir("src/${overlay}/java")
    sourceSets.main.resources.srcDir("src/${overlay}/resources")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(java_version)
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : project.version,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_minecraft_dependency'  : fabric_minecraft_dependency,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : rootProject.property('mod_description'),
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version,
            'resource_pack_format'         : resource_pack_format
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}
